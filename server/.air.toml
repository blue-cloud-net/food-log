# air 热重载配置（仅开发环境使用）
root = "."
tmp_dir = ".air"

[build]
  cmd = "go build -o ./.air/server ./cmd/main.go"
  bin = "./.air/server"
  include_ext = ["go", "sql", "toml"]
  exclude_dir = [".air", "bin", "tmp", "uploads", "data", "internal/web/dist"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = "1s"

[log]
  time = true

[misc]
  clean_on_exit = true
