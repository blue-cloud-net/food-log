version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: foodlog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodlog123}
      POSTGRES_DB: ${POSTGRES_DB:-foodlog}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodlog} -d ${POSTGRES_DB:-foodlog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: foodlog-server
    restart: unless-stopped
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-foodlog}:${POSTGRES_PASSWORD:-foodlog123}@db:5432/${POSTGRES_DB:-foodlog}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-foodlog-secret-change-me}
      UPLOAD_DIR: /app/uploads
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-3}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    ports:
      - "${SERVER_PORT:-8080}:8080"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: foodlog-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-80}:80"

volumes:
  pgdata:
  uploads:
