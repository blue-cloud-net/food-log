# =============================================
# 开发编排：PostgreSQL + 后端(air 热重载) + 前端(pnpm dev)
#
# 源码目录挂载进容器，改代码即生效：
#   - server/ 挂载到 /app，air 监听 *.go / *.sql 自动重编译
#   - client/ 挂载到 /app，Vite dev server 提供 HMR
#
# 与生产的关键差异：APP_ENV=development → 额外加载演示数据（admin/admin 与示例菜谱），
# 且不会引导生产管理员账号。数据库使用独立卷，避免污染生产数据。
#
# 用法：bash scripts/start-dev.sh
# =============================================
services:
  db:
    image: postgres:16-alpine
    container_name: foodlog-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodlog123}
      POSTGRES_DB: ${POSTGRES_DB:-foodlog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodlog} -d ${POSTGRES_DB:-foodlog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: foodlog-dev-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      SERVER_PORT: 8080
      DATA_DIR: /app/data
      DATABASE_URL: postgres://${POSTGRES_USER:-foodlog}:${POSTGRES_PASSWORD:-foodlog123}@db:5432/${POSTGRES_DB:-foodlog}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-foodlog-secret-change-me}
      CLIENT_ORIGIN: http://localhost:${CLIENT_PORT:-5173}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-3}
    volumes:
      - ./server:/app
      - ./data:/app/data
    ports:
      - "${SERVER_PORT:-8080}:8080"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: foodlog-dev-client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      # Vite 代理 /api 与 /images 到后端容器
      VITE_PROXY_TARGET: http://server:8080
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    command: ["sh", "-c", "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"]

volumes:
  pgdata-dev:
    name: foodlog-pgdata-dev
  client_node_modules:
